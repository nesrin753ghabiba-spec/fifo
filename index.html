<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FIFO — أزياء نسائية</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Cairo:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--blush:#f7ede8;--mauve:#c9a89a;--deep:#3a2820;--cream:#fdf8f5;--gold:#b8925a;--border:#e8d5ce;--wa:#25D366;--red:#c0392b}
html,body{height:100%}
body{background:var(--cream);color:var(--deep);font-size:14px;overflow-x:hidden}
body.rtl{font-family:'Cairo',sans-serif;direction:rtl}
body.ltr{font-family:'Inter',sans-serif;direction:ltr}
#view-list{display:block}#view-detail{display:none}
.lang-bar{background:#fff;border-bottom:.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:8px 14px;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.lang-btns{display:flex;gap:5px}
.lbtn{background:transparent;border:.5px solid var(--border);border-radius:20px;padding:4px 12px;font-size:11px;cursor:pointer;color:var(--deep);transition:all .15s}
.lbtn.active{background:var(--deep);color:#f0e4dc;border-color:var(--deep)}
.right-bar{display:flex;gap:8px;align-items:center}
.cart-btn{background:transparent;border:.5px solid var(--border);border-radius:20px;padding:4px 12px;font-size:11px;cursor:pointer;color:var(--deep);display:flex;align-items:center;gap:5px;transition:all .15s}
.cart-btn:hover{background:var(--blush)}
.cart-badge{background:var(--gold);color:#fff;font-size:9px;border-radius:50%;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;font-weight:500}
.admin-btn{background:transparent;border:.5px solid var(--mauve);border-radius:20px;padding:4px 12px;font-size:11px;cursor:pointer;color:var(--mauve);display:flex;align-items:center;gap:4px;transition:all .15s}
.admin-btn:hover{background:var(--blush)}
.admin-btn.on{background:var(--deep);color:var(--gold);border-color:var(--deep)}
.admin-strip{background:rgba(184,146,90,.12);border-bottom:1px solid rgba(184,146,90,.3);padding:5px 14px;font-size:11px;color:var(--gold);text-align:center;display:none}
.admin-strip.show{display:block}
.save-indicator{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--deep);color:#f0e4dc;padding:8px 18px;border-radius:20px;font-size:12px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.save-indicator.show{opacity:1}
.page-wrap{display:flex}
.main-content{flex:1;min-width:0}
.side-cart{width:300px;min-width:300px;background:#fff;border-left:.5px solid var(--border);display:none;flex-direction:column;position:sticky;top:50px;max-height:calc(100vh - 50px);overflow-y:auto}
body.rtl .side-cart{border-left:none;border-right:.5px solid var(--border)}
.side-cart.open{display:flex}
.hero{background:var(--blush);padding:2rem 2rem 1.4rem;text-align:center;border-bottom:1px solid var(--border)}
.brand{font-family:'Cormorant Garamond',serif;font-size:50px;font-weight:300;letter-spacing:.18em;color:var(--deep);line-height:1}
.tagline{font-size:10px;letter-spacing:.25em;color:var(--mauve);text-transform:uppercase;margin-top:6px}
.sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--gold);margin-top:6px;font-weight:300}
.pay-bar{background:var(--deep);color:#f0e4dc;padding:8px 1rem;font-size:10px;letter-spacing:.08em;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.pay-bar span{display:flex;align-items:center;gap:4px}
.pay-bar i{color:var(--gold);font-size:13px}
.toolbar{display:flex;gap:8px;padding:12px 14px 0;flex-wrap:wrap;align-items:center}
.search-wrap{flex:1;min-width:120px;position:relative}
.search-wrap i{position:absolute;top:50%;transform:translateY(-50%);color:var(--mauve);font-size:14px;pointer-events:none}
body.rtl .search-wrap i{right:10px}
body.ltr .search-wrap i{left:10px}
.search-inp{width:100%;border:.5px solid var(--border);border-radius:20px;font-size:12px;background:var(--cream);color:var(--deep);outline:none}
body.rtl .search-inp{padding:7px 30px 7px 12px}
body.ltr .search-inp{padding:7px 12px 7px 30px}
.search-inp:focus{border-color:var(--gold)}
.filter-btns{display:flex;gap:4px;flex-wrap:wrap}
.fbtn{background:transparent;border:.5px solid var(--border);border-radius:20px;padding:4px 10px;font-size:11px;cursor:pointer;color:var(--deep);transition:all .15s}
.fbtn.active{background:var(--gold);color:#fff;border-color:var(--gold)}
.sort-sel{border:.5px solid var(--border);border-radius:20px;padding:5px 10px;font-size:11px;background:var(--cream);color:var(--deep);outline:none;cursor:pointer}
.discount-bar{padding:10px 14px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.disc-title{font-size:11px;color:var(--mauve)}
.disc-tags{display:flex;gap:6px;flex-wrap:wrap}
.disc-tag{background:var(--blush);border:.5px solid var(--border);border-radius:20px;padding:4px 10px;font-size:11px;cursor:pointer;color:var(--deep);transition:all .15s;display:flex;align-items:center;gap:4px}
.disc-tag.active{background:#fff3cd;border-color:var(--gold)}
.disc-tag i{font-size:12px;color:var(--gold)}
.sec-head{padding:1.2rem 1.4rem 0;text-align:center}
.sec-title{font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:400;color:var(--deep);letter-spacing:.06em}
.sec-rule{width:34px;height:1px;background:var(--gold);margin:5px auto 1.2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:0 14px 1.5rem}
.no-results{text-align:center;padding:2rem;color:var(--mauve);font-size:13px;grid-column:1/-1}
.card{background:#fff;border:.5px solid var(--border);border-radius:12px;overflow:hidden;transition:transform .2s;cursor:pointer}
.card:hover{transform:translateY(-2px)}
.card-media{background:var(--blush);height:185px;position:relative;overflow:hidden;border-bottom:.5px solid var(--border)}
.card-media input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;z-index:3}
.card-thumb{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.uhint{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:100%;pointer-events:none}
.uhint i{font-size:22px;color:var(--mauve)}
.uhint p{font-size:10px;color:var(--mauve);text-align:center}
.cbadge{position:absolute;top:8px;font-size:9px;padding:2px 7px;border-radius:20px;z-index:2}
body.rtl .cbadge{left:8px}
body.ltr .cbadge{right:8px}
.cbadge.sale{background:#fff3cd;color:#7a5c00;border:.5px solid #e8c84a}
.cbadge.regular{background:var(--deep);color:#f0e4dc}
.sold-overlay{position:absolute;inset:0;background:rgba(58,40,32,.55);display:flex;align-items:center;justify-content:center;z-index:4}
.sold-overlay span{color:#f0e4dc;font-size:12px;font-weight:500}
.card-body{padding:10px 12px}
.card-name{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:400;color:var(--deep);margin-bottom:3px}
.card-caption{font-size:11px;color:#8a6a5e;line-height:1.4;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price-row{display:flex;align-items:center;gap:6px}
.card-price{font-size:13px;font-weight:500;color:var(--gold)}
.card-price-old{font-size:11px;color:var(--mauve);text-decoration:line-through}
.card-actions{display:flex;gap:5px;margin-top:8px}
.btn-cart{flex:1;background:var(--deep);color:#f0e4dc;border:none;border-radius:7px;padding:6px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:opacity .15s}
.btn-cart:hover{opacity:.85}
.btn-cart:disabled{background:var(--mauve);cursor:default;opacity:1}
.btn-fav{background:transparent;border:.5px solid var(--border);border-radius:7px;padding:6px 9px;cursor:pointer;color:var(--mauve);font-size:13px;transition:all .15s}
.btn-fav:hover,.btn-fav.on{color:var(--red);border-color:var(--red)}
.edit-inp{width:100%;border:.5px solid var(--border);border-radius:6px;padding:5px 8px;font-size:12px;color:var(--deep);background:var(--cream);outline:none;margin-bottom:4px}
.edit-inp:focus{border-color:var(--gold)}
.edit-ta{width:100%;border:.5px solid var(--border);border-radius:6px;padding:5px 8px;font-size:11px;color:var(--deep);background:var(--cream);outline:none;resize:none;line-height:1.5}
.edit-ta:focus{border-color:var(--gold)}
.elbl{font-size:9px;color:var(--mauve);letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px;margin-top:5px}
.stock-row{display:flex;align-items:center;gap:5px;margin-top:5px}
.del-btn{width:100%;margin-top:6px;background:transparent;border:.5px solid #e8d5ce;border-radius:6px;padding:5px;font-size:11px;color:#b07070;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.del-btn:hover{background:#fff0f0}
.add-card{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;border:1px dashed var(--mauve);border-radius:12px;color:var(--mauve);font-size:12px;cursor:pointer;padding:1.2rem 1rem;transition:all .2s;min-height:220px;background:transparent}
.add-card:hover{background:var(--blush);border-color:var(--gold);color:var(--gold)}
.add-card i{font-size:22px}
.side-cart-header{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-bottom:.5px solid var(--border)}
.side-cart-title{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--deep)}
.side-cart-close{background:transparent;border:none;cursor:pointer;color:var(--mauve);font-size:16px;padding:2px}
.side-cart-body{flex:1;overflow-y:auto;padding:10px 14px}
.cart-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:.5px solid var(--border)}
.cart-item-name{flex:1;font-size:12px;line-height:1.4}
.cart-item-price{font-size:12px;color:var(--gold);font-weight:500;min-width:55px;text-align:center}
.cart-item-remove{background:transparent;border:none;color:var(--mauve);cursor:pointer;font-size:13px;padding:2px}
.cart-item-remove:hover{color:var(--red)}
.qty-ctrl{display:flex;align-items:center;gap:4px}
.qty-btn{background:transparent;border:.5px solid var(--border);border-radius:4px;width:20px;height:20px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.qty-btn:hover{background:var(--blush)}
.qty-val{font-size:12px;min-width:14px;text-align:center}
.empty-cart{text-align:center;padding:1.5rem;color:var(--mauve);font-size:12px}
.disc-code-row{display:flex;gap:6px;padding:10px 0 4px;border-top:.5px solid var(--border)}
.disc-code-inp{flex:1;border:.5px solid var(--border);border-radius:20px;padding:5px 10px;font-size:12px;background:var(--cream);color:var(--deep);outline:none}
.disc-code-inp:focus{border-color:var(--gold)}
.disc-apply-btn{background:var(--gold);color:#fff;border:none;border-radius:20px;padding:5px 11px;font-size:11px;cursor:pointer}
.disc-feedback{font-size:11px;min-height:14px;padding-bottom:4px}
.disc-feedback.ok{color:#2d6a4f}.disc-feedback.err{color:var(--red)}
.side-cart-footer{padding:12px 14px;border-top:.5px solid var(--border);background:#fff}
.cart-row{display:flex;justify-content:space-between;font-size:12px;color:var(--mauve);margin-bottom:3px}
.cart-row.discount{color:#2d6a4f;display:none}
.cart-row.total-row{font-size:14px;font-weight:500;color:var(--deep);margin-bottom:10px;padding-top:5px;border-top:.5px solid var(--border)}
.open-order-btn{width:100%;background:var(--deep);color:#f0e4dc;border:none;border-radius:8px;padding:10px;font-size:13px;cursor:pointer;transition:opacity .15s}
.open-order-btn:hover{opacity:.85}
.order-form{background:var(--blush);border:.5px solid var(--border);border-radius:10px;padding:12px;margin-top:10px;display:none}
.order-form-title{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--deep);margin-bottom:8px}
.form-group{margin-bottom:7px}
.form-label{font-size:10px;color:var(--mauve);letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px;display:block}
.req{color:var(--red)}
.form-inp{width:100%;border:.5px solid var(--border);border-radius:7px;padding:7px 10px;font-size:12px;color:var(--deep);background:#fff;outline:none}
.form-inp:focus{border-color:var(--gold)}
.form-inp.err-f{border-color:var(--red)}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.order-btn-wa{width:100%;background:var(--wa);color:#fff;border:none;border-radius:7px;padding:10px;font-size:13px;cursor:pointer;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:7px;transition:opacity .15s;font-weight:500}
.order-btn-wa:hover{opacity:.88}
.success-msg{background:#e8f5e9;border:.5px solid #a5d6a7;border-radius:8px;padding:10px;text-align:center;font-size:12px;color:#2d6a4f;margin-top:8px;display:none}
.success-msg.show{display:block}
.detail-wrap{max-width:900px;margin:0 auto;padding:1rem 1rem 2rem}
.detail-back{display:inline-flex;align-items:center;gap:6px;background:transparent;border:none;cursor:pointer;color:var(--mauve);font-size:13px;margin-bottom:1rem;padding:4px 0}
.detail-back:hover{color:var(--deep)}
.detail-layout{display:flex;gap:1.5rem;flex-wrap:wrap}
.detail-gallery{flex:1;min-width:280px}
.detail-main-img{width:100%;aspect-ratio:3/4;border-radius:12px;border:.5px solid var(--border);background:var(--blush);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.detail-main-img img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.detail-main-img video{width:100%;height:100%;object-fit:cover;display:block}
.detail-main-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:100%;color:var(--mauve);font-size:12px;width:100%}
.detail-main-placeholder i{font-size:32px}
.detail-thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.detail-thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;border:1.5px solid var(--border);cursor:pointer;transition:border-color .15s;flex-shrink:0;background:var(--blush);overflow:hidden}
.detail-thumb.active{border-color:var(--gold)}
.detail-thumb-add{width:64px;height:64px;border-radius:8px;border:1px dashed var(--mauve);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--mauve);font-size:18px;background:transparent;position:relative;transition:all .15s}
.detail-thumb-add:hover{border-color:var(--gold);color:var(--gold);background:var(--blush)}
.detail-thumb-add input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.detail-info{flex:1;min-width:240px}
.detail-badge{display:inline-block;background:var(--deep);color:#f0e4dc;font-size:10px;padding:3px 10px;border-radius:20px;letter-spacing:.1em;margin-bottom:10px}
.detail-name{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:400;color:var(--deep);line-height:1.2;margin-bottom:8px}
.detail-caption{font-size:13px;color:#8a6a5e;line-height:1.7;margin-bottom:14px}
.detail-price-row{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.detail-price{font-size:22px;font-weight:500;color:var(--gold)}
.detail-price-old{font-size:15px;color:var(--mauve);text-decoration:line-through}
.detail-actions{display:flex;gap:10px;flex-wrap:wrap}
.detail-btn-cart{flex:1;min-width:130px;background:var(--deep);color:#f0e4dc;border:none;border-radius:10px;padding:12px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s}
.detail-btn-cart:hover{opacity:.85}
.detail-btn-cart:disabled{background:var(--mauve);cursor:default}
.detail-btn-fav{background:transparent;border:.5px solid var(--border);border-radius:10px;padding:12px 16px;cursor:pointer;color:var(--mauve);font-size:16px;transition:all .15s}
.detail-btn-fav:hover,.detail-btn-fav.on{color:var(--red);border-color:var(--red)}
.detail-admin-edit{background:var(--blush);border:.5px solid var(--border);border-radius:10px;padding:14px;margin-top:16px}
.detail-admin-title{font-size:11px;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:200}
.lightbox.show{display:flex}
.lightbox img,.lightbox video{max-width:92vw;max-height:90vh;object-fit:contain;border-radius:8px}
.lightbox-close{position:absolute;top:16px;right:16px;background:transparent;border:none;color:#fff;font-size:22px;cursor:pointer}
.contact-sec{background:var(--blush);padding:1.5rem 1.4rem}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;max-width:520px;margin:0 auto}
.ccard{background:#fff;border:.5px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.ccard i{font-size:18px;color:var(--gold);margin-bottom:3px;display:block}
.clbl{font-size:9px;color:var(--mauve);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.cval{font-size:11px;color:var(--deep);font-weight:500;word-break:break-all}
.cval a{color:var(--wa);text-decoration:none}
.wa-contact-btn{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--wa);color:#fff;border:none;border-radius:10px;padding:11px;font-size:13px;cursor:pointer;text-decoration:none;font-weight:500;max-width:300px;margin:14px auto 0;transition:opacity .15s}
.wa-contact-btn:hover{opacity:.88}
.footer{background:var(--deep);padding:1.2rem;text-align:center}
.fn{font-family:'Cormorant Garamond',serif;font-size:20px;letter-spacing:.2em;color:#f0e4dc;font-weight:300}
.fp{font-size:10px;color:#8a6a5e;margin-top:4px;letter-spacing:.06em}
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:300}
.modal-wrap.show{display:flex}
.modal{background:#fff;border-radius:14px;padding:1.6rem;width:270px;text-align:center;border:.5px solid var(--border)}
.modal h3{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--deep);margin-bottom:5px}
.modal p{font-size:11px;color:#8a6a5e;margin-bottom:12px}
.modal input{width:100%;border:.5px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px;color:var(--deep);outline:none;text-align:center;letter-spacing:.15em;background:var(--cream)}
.modal input:focus{border-color:var(--gold)}
.mbtns{display:flex;gap:6px;margin-top:10px}
.mbtn{flex:1;padding:8px;border-radius:7px;border:.5px solid var(--border);cursor:pointer;font-size:12px;background:transparent;color:var(--deep)}
.mbtn.ok{background:var(--deep);color:#f0e4dc;border-color:var(--deep)}
.merr{font-size:10px;color:var(--red);margin-top:5px;min-height:13px}
@media(max-width:600px){.side-cart{width:100vw;min-width:0;position:fixed;inset:0;top:50px;z-index:100;border:none}.detail-layout{flex-direction:column}.detail-name{font-size:22px}.grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}}
</style>
</head>
<body class="rtl">

<div class="save-indicator" id="save-indicator">✓ تم الحفظ تلقائياً</div>
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()"><i class="ti ti-x"></i></button>
  <div id="lightbox-content"></div>
</div>
<div class="modal-wrap" id="pwd-modal">
  <div class="modal">
    <h3>Admin</h3>
    <p id="mprompt">أدخل كلمة المرور</p>
    <input type="password" id="pwd-inp" maxlength="20" placeholder="••••••" />
    <div class="merr" id="merr"></div>
    <div class="mbtns">
      <button class="mbtn" onclick="closeModal()" id="m-cancel">إلغاء</button>
      <button class="mbtn ok" onclick="checkPwd()" id="m-enter">دخول</button>
    </div>
  </div>
</div>

<div class="lang-bar">
  <div class="lang-btns">
    <button class="lbtn" onclick="setLang('fr')">FR</button>
    <button class="lbtn" onclick="setLang('en')">EN</button>
    <button class="lbtn active" onclick="setLang('ar')">عر</button>
  </div>
  <div class="right-bar">
    <button class="cart-btn" onclick="toggleCart()">
      <i class="ti ti-shopping-bag"></i>
      <span class="cart-badge" id="cart-count">0</span>
    </button>
    <button class="admin-btn" id="admin-btn" onclick="toggleAdmin()">
      <i class="ti ti-lock"></i><span>Admin</span>
    </button>
  </div>

  const imgs=item.images||[];const curImg=imgs[currentDetailImgIdx];
  let mainHtml='';
  if(curImg){if(curImg.type==='video')mainHtml=`<video src="${curImg.url}" autoplay muted loop controls style="width:100%;height:100%;object-fit:cover;display:block"></video>`;else mainHtml=`<img src="${curImg.url}" alt="${item.name[lang]}" style="width:100%;height:100%;object-fit:cover;display:block" onclick="openLightbox(${currentDetailImgIdx},${idx})" />`;}
  else{mainHtml=`<div class="detail-main-placeholder"><i class="ti ti-camera"></i><span>${t.addPhoto}</span></div>`;}
  let thumbsHtml='';
  imgs.forEach((img,i)=>{if(img.type==='video')thumbsHtml+=`<div class="detail-thumb${i===currentDetailImgIdx?' active':''}" onclick="selectImg(${i},${idx})" style="display:flex;align-items:center;justify-content:center;background:var(--deep)"><i class="ti ti-player-play" style="color:#f0e4dc;font-size:16px"></i></div>`;else thumbsHtml+=`<img class="detail-thumb${i===currentDetailImgIdx?' active':''}" src="${img.url}" onclick="selectImg(${i},${idx})" alt="" />`;});
  if(isAdmin&&imgs.length<MAX_IMGS){thumbsHtml+=`<div class="detail-thumb-add"><i class="ti ti-plus"></i><input type="file" accept="image/*,video/*" multiple onchange="addDetailImgs(event,${idx})" /></div>`;}
  let adminEditHtml='';
  if(isAdmin){adminEditHtml=`<div class="detail-admin-edit"><div class="detail-admin-title">✏️ ${t.adminOn}</div><div class="elbl">${t.nameLbl}</div><input class="edit-inp" value="${item.name[lang]}" oninput="items[${idx}].name['${lang}']=this.value;document.getElementById('d-name').textContent=this.value;saveItems()" /><div class="elbl">${t.priceLbl}</div><input class="edit-inp" type="number" value="${item.price}" oninput="items[${idx}].price=parseInt(this.value)||0;renderDetailPrices(${idx});saveItems()" /><div class="elbl">${t.badgeLbl}</div><input class="edit-inp" value="${item.badge[lang]}" oninput="items[${idx}].badge['${lang}']=this.value;saveItems()" /><div class="elbl">${t.catLbl}</div><select class="edit-inp" onchange="items[${idx}].cat=parseInt(this.value);saveItems()">${t.cats.slice(1).map((c,ci)=>`<option value="${ci}"${item.cat===ci?' selected':''}>${c}</option>`).join('')}</select><div class="elbl">${t.captionLbl}</div><textarea class="edit-ta" rows="3" oninput="items[${idx}].caption['${lang}']=this.value;document.getElementById('d-cap').textContent=this.value;saveItems()">${item.caption[lang]}</textarea><div class="stock-row"><input type="checkbox" id="dstk${idx}" ${item.inStock?'checked':''} onchange="items[${idx}].inStock=this.checked;saveItems()" style="accent-color:var(--gold)" /><label for="dstk${idx}" style="font-size:11px;color:var(--mauve);cursor:pointer">${t.stockLbl}</label></div><button class="del-btn" onclick="deleteItem(${idx});closeDetail()" style="margin-top:8px"><i class="ti ti-trash"></i>${t.delete}</button></div>`;}
  document.getElementById('detail-wrap').innerHTML=`<button class="detail-back" onclick="closeDetail()"><i class="ti ti-arrow-${t.dir==='rtl'?'right':'left'}"></i>${t.back}</button><div class="detail-layout" style="direction:${t.dir}"><div class="detail-gallery"><div class="detail-main-img" style="aspect-ratio:3/4">${mainHtml}</div><div class="detail-thumbs">${thumbsHtml}</div></div><div class="detail-info">${item.badge[lang]?`<span class="detail-badge">${item.badge[lang]}</span>`:''}<div class="detail-name" id="d-name">${item.name[lang]}</div><div class="detail-caption" id="d-cap">${item.caption[lang]}</div><div class="detail-price-row" id="d-price-row"><span class="detail-price" id="d-price">${dp.toLocaleString()} DA</span>${discounted?`<span class="detail-price-old" id="d-price-old">${item.price.toLocaleString()} DA</span>`:''}</div>${!item.inStock?`<div style="color:var(--red);font-size:12px;margin-bottom:12px">${t.soldOut}</div>`:''}<div class="detail-actions"><button class="detail-btn-cart" onclick="addToCart(${idx})" ${!item.inStock||inCart?'disabled':''}><i class="ti ti-shopping-bag"></i>${inCart?'✓':t.addCart}</button><button class="detail-btn-fav${isFav?' on':''}" onclick="toggleFav(${idx});renderDetail(${idx})"><i class="ti ti-heart"></i></button></div>${adminEditHtml}</div></div>`;
}
function renderDetailPrices(idx){const item=items[idx],dp=discPrice(item),discounted=dp<item.price;const pr=document.getElementById('d-price');if(pr)pr.textContent=dp.toLocaleString()+' DA';const po=document.getElementById('d-price-old');if(discounted&&!po){const row=document.getElementById('d-price-row');if(row){const s=document.createElement('span');s.id='d-price-old';s.className='detail-price-old';s.textContent=item.price.toLocaleString()+' DA';row.appendChild(s);}}else if(!discounted&&po)po.remove();}
function selectImg(i,idx){currentDetailImgIdx=i;renderDetail(idx);}
function addDetailImgs(e,idx){
  const files=Array.from(e.target.files);
  const remaining=MAX_IMGS-(items[idx].images||[]).length;
  const promises=files.slice(0,remaining).map(f=>new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=ev=>resolve({url:ev.target.result,type:f.type.startsWith('video/')?'video':'image'});
    reader.readAsDataURL(f);
  }));
  Promise.all(promises).then(newImgs=>{
    if(!items[idx].images)items[idx].images=[];
    items[idx].images.push(...newImgs);
    currentDetailImgIdx=items[idx].images.length-1;
    saveItems();renderDetail(idx);renderGrid();
  });
}
function openLightbox(i,idx){const img=items[idx].images[i];if(!img)return;const lb=document.getElementById('lightbox'),lbc=document.getElementById('lightbox-content');lbc.innerHTML=img.type==='video'?`<video src="${img.url}" autoplay controls style="max-width:92vw;max-height:90vh"></video>`:`<img src="${img.url}" alt="" />`;lb.classList.add('show');}
function closeLightbox(){document.getElementById('lightbox').classList.remove('show');}
function addToCart(idx){const e=cart.find(c=>c.idx===idx);if(e)e.qty++;else cart.push({idx,qty:1});updateBadge();renderGrid();renderCartBody();if(currentDetailIdx>=0)renderDetail(currentDetailIdx);if(!cartOpen)toggleCart();}
function removeFromCart(idx){cart=cart.filter(c=>c.idx!==idx);updateBadge();renderGrid();renderCartBody();}
function changeQty(idx,d){const c=cart.find(x=>x.idx===idx);if(!c)return;c.qty+=d;if(c.qty<=0){removeFromCart(idx);return;}updateBadge();renderCartBody();}
function updateBadge(){document.getElementById('cart-count').textContent=cart.reduce((s,c)=>s+c.qty,0);}
function toggleFav(idx){if(favs.has(idx))favs.delete(idx);else favs.add(idx);renderGrid();}
function toggleCart(){cartOpen=!cartOpen;document.getElementById('side-cart').classList.toggle('open',cartOpen);if(cartOpen)renderCartBody();}
function toggleOrderForm(){orderOpen=!orderOpen;document.getElementById('order-form').style.display=orderOpen?'block':'none';document.getElementById('success-msg').classList.remove('show');}
function renderCartBody(){
  const t=tx(),body=document.getElementById('cart-body'),footer=document.getElementById('cart-footer');
  body.innerHTML='';body.style.direction=t.dir;
  if(cart.length===0){body.innerHTML=`<div class="empty-cart"><i class="ti ti-shopping-bag" style="font-size:22px;color:var(--mauve);display:block;margin-bottom:5px"></i>${lang==='ar'?'السلة فارغة':'Panier vide'}</div>`;footer.style.display='none';return;}
  let subtotal=0;
  cart.forEach(c=>{const item=items[c.idx];if(!item)return;const dp=discPrice(item),sub=dp*c.qty;subtotal+=sub;const row=document.createElement('div');row.className='cart-item';row.style.direction=t.dir;row.innerHTML=`<div class="cart-item-name">${item.name[lang]}<br><small style="color:var(--mauve)">${dp.toLocaleString()} DA</small></div><div class="qty-ctrl"><button class="qty-btn" onclick="changeQty(${c.idx},-1)">−</button><span class="qty-val">${c.qty}</span><button class="qty-btn" onclick="changeQty(${c.idx},1)">+</button></div><div class="cart-item-price">${sub.toLocaleString()}</div><button class="cart-item-remove" onclick="removeFromCart(${c.idx})"><i class="ti ti-x"></i></button>`;body.appendChild(row);});
  footer.style.display='block';footer.style.direction=t.dir;
  const origTotal=cart.reduce((s,c)=>{const it=items[c.idx];return it?s+it.price*c.qty:s},0);
  document.getElementById('cart-subtotal').textContent=origTotal.toLocaleString()+' DA';
  const drow=document.getElementById('discount-row'),discAmt=origTotal-subtotal;
  if(discAmt>0){drow.style.display='flex';document.getElementById('cart-discount-val').textContent='-'+discAmt.toLocaleString()+' DA';}else drow.style.display='none';
  document.getElementById('cart-total-val').textContent=subtotal.toLocaleString()+' DA';
}
function sendWaOrder(){
  const fname=document.getElementById('f-fname').value.trim(),lname=document.getElementById('f-lname').value.trim(),phone=document.getElementById('f-phone').value.trim(),wilaya=document.getElementById('f-wilaya').value,addr=document.getElementById('f-addr').value.trim();
  let valid=true;
  [['f-fname',fname],['f-lname',lname],['f-phone',phone],['f-addr',addr]].forEach(([id,v])=>{const el=document.getElementById(id);if(!v){el.classList.add('err-f');valid=false;}else el.classList.remove('err-f');});
  const wel=document.getElementById('f-wilaya');if(!wilaya){wel.classList.add('err-f');valid=false;}else wel.classList.remove('err-f');
  if(!valid)return;
  let msg=`🛍️ طلب جديد — FIFO\n\n👤 ${fname} ${lname}\n📞 ${phone}\n📍 ${wilaya}\n🏠 ${addr}\n`;
  const note=document.getElementById('f-note').value.trim();if(note)msg+=`📝 ${note}\n`;
  msg+=`\n--- المنتجات ---\n`;let total=0;
  cart.forEach(c=>{const it=items[c.idx];if(!it)return;const dp=discPrice(it),sub=dp*c.qty;total+=sub;msg+=`• ${it.name['ar']} x${c.qty} = ${sub.toLocaleString()} DA\n`;});
  const orig=cart.reduce((s,c)=>{const it=items[c.idx];return it?s+it.price*c.qty:s},0);
  if(activeDiscount>0)msg+=`🏷️ تخفيض: -${(orig-total).toLocaleString()} DA\n`;
  msg+=`\n💰 المجموع: ${total.toLocaleString()} DA`;
  window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`,'_blank');
  document.getElementById('success-msg').textContent=tx().success;document.getElementById('success-msg').classList.add('show');
  setTimeout(()=>{cart=[];updateBadge();renderGrid();renderCartBody();document.getElementById('order-form').style.display='none';document.getElementById('success-msg').classList.remove('show');orderOpen=false;},3500);
}
function deleteItem(idx){items.splice(idx,1);cart=cart.filter(c=>c.idx!==idx);saveItems();updateBadge();renderGrid();renderCartBody();}
function addItem(){items.push({name:{ar:"قطعة جديدة",fr:"Nouvelle pièce",en:"New item"},price:0,badge:{ar:"",fr:"",en:""},caption:{ar:"",fr:"",en:""},cat:0,inStock:true,images:[]});saveItems();renderGrid();}
function toggleAdmin(){if(isAdmin){isAdmin=false;updateAdminUI();renderGrid();if(currentDetailIdx>=0)renderDetail(currentDetailIdx);}else{document.getElementById('merr').textContent='';document.getElementById('pwd-inp').value='';document.getElementById('pwd-modal').classList.add('show');setTimeout(()=>document.getElementById('pwd-inp').focus(),100);}}
function checkPwd(){if(document.getElementById('pwd-inp').value===PASS){isAdmin=true;closeModal();updateAdminUI();renderGrid();if(currentDetailIdx>=0)renderDetail(currentDetailIdx);}else{document.getElementById('merr').textContent=tx().wrongPwd;document.getElementById('pwd-inp').value='';}}
function closeModal(){document.getElementById('pwd-modal').classList.remove('show');}
document.getElementById('pwd-inp').addEventListener('keydown',e=>{if(e.key==='Enter')checkPwd();});
function updateAdminUI(){const btn=document.getElementById('admin-btn'),strip=document.getElementById('admin-strip');if(isAdmin){btn.classList.add('on');btn.innerHTML=`<i class="ti ti-shield-check"></i><span>Admin ✓</span>`;strip.classList.add('show');}else{btn.classList.remove('on');btn.innerHTML=`<i class="ti ti-lock"></i><span>Admin</span>`;strip.classList.remove('show');}}

applyLang();renderGrid();
</script>
</body>
</html>
